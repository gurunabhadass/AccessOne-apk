name: Build AccessOne APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AccessOne.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Extract AccessOne website
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "AccessOne.zip" ]; then
            echo "ERROR: AccessOne.zip was not found in the repository root."
            echo "Upload the ZIP with the exact filename: AccessOne.zip"
            exit 1
          fi

          mkdir -p extracted www
          unzip -q "AccessOne.zip" -d extracted

          INDEX_FILE="$(find extracted -type f -name index.html -print -quit)"
          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html was not found inside AccessOne.zip."
            exit 1
          fi

          WEBSITE_ROOT="$(dirname "$INDEX_FILE")"
          cp -R "$WEBSITE_ROOT"/. www/

          test -s www/index.html
          test -s www/logo.png

          # The supplied page registers service-worker.js, while the ZIP
          # contains service.worker.js. Provide the expected filename too.
          if [ -f "www/service.worker.js" ] && [ ! -f "www/service-worker.js" ]; then
            cp "www/service.worker.js" "www/service-worker.js"
          fi

          echo "AccessOne web files extracted successfully."
          find www -maxdepth 2 -type f -print | sort

      - name: Create Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7

          npx cap init "AccessOne" "com.accessone.app" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Configure Android app permissions and launcher icon
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          permissions = [
              "android.permission.CAMERA",
              "android.permission.INTERNET",
          ]
          for permission in permissions:
              tag = f'<uses-permission android:name="{permission}" />'
              if permission not in text:
                  text = text.replace("<application", tag + "\n    <application", 1)

          # Camera hardware is optional so the app can still open on devices
          # where camera access is unavailable.
          feature = '<uses-feature android:name="android.hardware.camera" android:required="false" />'
          if "android.hardware.camera" not in text:
              text = text.replace("<application", feature + "\n    <application", 1)

          text = re.sub(
              r'android:icon="@[^"]+"',
              'android:icon="@drawable/accessone_icon"',
              text,
              count=1
          )

          manifest.write_text(text, encoding="utf-8")
          PY

          mkdir -p android/app/src/main/res/drawable-nodpi
          cp www/logo.png android/app/src/main/res/drawable-nodpi/accessone_icon.png

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

          mkdir -p ../release-apk
          cp app/build/outputs/apk/debug/app-debug.apk ../release-apk/AccessOne.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AccessOne-APK
          path: release-apk/AccessOne.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: accessone-latest
          name: AccessOne Latest Build
          body: |
            Automatically generated AccessOne Android APK.
            This is a debug build for installation and testing.
          files: release-apk/AccessOne.apk
          overwrite_files: true
          make_latest: true
          
