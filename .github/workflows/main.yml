name: Build AccessOne APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AccessOne-Android-Ready-v2.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Extract AccessOne website
        shell: bash
        run: |
          set -euo pipefail
          test -s "AccessOne-Android-Ready-v2.zip" || {
            echo "ERROR: Upload AccessOne-Android-Ready-v2.zip to the repository root."
            exit 1
          }
          mkdir -p extracted www
          unzip -q "AccessOne-Android-Ready-v2.zip" -d extracted
          INDEX_FILE="$(find extracted -type f -name index.html -print -quit)"
          test -n "$INDEX_FILE" || { echo "ERROR: index.html missing in ZIP"; exit 1; }
          WEBSITE_ROOT="$(dirname "$INDEX_FILE")"
          cp -R "$WEBSITE_ROOT"/. www/
          test -s www/index.html
          test -s www/logo.png
          echo "AccessOne files extracted."

      - name: Create Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7
          npx cap init "AccessOne" "com.accessone.app" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Configure Android app identity, permissions and supplied logo
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          perms = [
              "android.permission.CAMERA",
              "android.permission.INTERNET",
          ]
          for perm in perms:
              tag = f'<uses-permission android:name="{perm}" />'
              if perm not in text:
                  text = text.replace("<application", tag + "\n    <application", 1)

          feature = '<uses-feature android:name="android.hardware.camera" android:required="false" />'
          if "android.hardware.camera" not in text:
              text = text.replace("<application", feature + "\n    <application", 1)

          app_match = re.search(r'<application\b[^>]*>', text, re.DOTALL)
          if not app_match:
              raise SystemExit("AndroidManifest application tag not found")
          app_tag = app_match.group(0)
          app_tag = re.sub(r'\s+android:icon="[^"]*"', '', app_tag)
          app_tag = re.sub(r'\s+android:roundIcon="[^"]*"', '', app_tag)
          app_tag = re.sub(r'\s+android:label="[^"]*"', '', app_tag)
          app_tag = app_tag[:-1] + ' android:label="AccessOne" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round">'
          text = text[:app_match.start()] + app_tag + text[app_match.end():]
          manifest.write_text(text, encoding="utf-8")

          import xml.etree.ElementTree as ET
          ET.parse(manifest)
          print("AndroidManifest.xml is valid.")

          # Use only the user's own logo.png. No generated or Android default logo.
          source = Image.open("www/logo.png").convert("RGBA")
          densities = {
              "mdpi": 48, "hdpi": 72, "xhdpi": 96,
              "xxhdpi": 144, "xxxhdpi": 192
          }
          res = Path("android/app/src/main/res")
          for density, px in densities.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              icon = source.resize((px, px), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")

          PY

      - name: Add Android Back handling bridge
        shell: bash
        run: |
          set -euo pipefail
          JAVA_DIR="android/app/src/main/java/com/accessone/app"
          mkdir -p "$JAVA_DIR"
          cat > "$JAVA_DIR/MainActivity.java" <<'EOF'
          package com.accessone.app;

          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.widget.Toast;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private boolean backRequestPending = false;
              private long lastBackPressTime = 0L;
              private static final long EXIT_WINDOW_MS = 2000L;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (backRequestPending) return;

                  if (getBridge() == null || getBridge().getWebView() == null) {
                      requestDoubleBackExit();
                      return;
                  }

                  WebView webView = getBridge().getWebView();
                  backRequestPending = true;
                  webView.evaluateJavascript(
                      "(function(){try{return window.AccessOneHandleAndroidBack ? " +
                      "window.AccessOneHandleAndroidBack() : false;}catch(e){return false;}})()",
                      value -> {
                          backRequestPending = false;
                          if ("true".equals(value)) {
                              lastBackPressTime = 0L;
                              return;
                          }
                          if (webView.canGoBack()) {
                              lastBackPressTime = 0L;
                              webView.goBack();
                              return;
                          }
                          requestDoubleBackExit();
                      }
                  );
              }

              private void requestDoubleBackExit() {
                  long now = System.currentTimeMillis();
                  if (now - lastBackPressTime <= EXIT_WINDOW_MS) {
                      finish();
                      return;
                  }
                  lastBackPressTime = now;
                  Toast.makeText(this, "Press back again to exit", Toast.LENGTH_SHORT).show();
                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      if (System.currentTimeMillis() - lastBackPressTime >= EXIT_WINDOW_MS) {
                          lastBackPressTime = 0L;
                      }
                  }, EXIT_WINDOW_MS + 50L);
              }
          }
          EOF

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace
          mkdir -p ../release-apk
          cp app/build/outputs/apk/debug/app-debug.apk ../release-apk/AccessOne.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AccessOne-APK
          path: release-apk/AccessOne.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: accessone-latest
          name: AccessOne Latest Build
          body: "AccessOne Android debug APK generated by GitHub Actions."
          files: release-apk/AccessOne.apk
          overwrite_files: true
          make_latest: true
          
